name: wheels

# Builds the manylinux wheels (RocksDB, Snappy and LZ4 linked in) with
# cibuildwheel, tests each wheel, and attaches them to the GitHub release
# that triggered the run.
#
#   - publish a release on GitHub (tag e.g. 0.4.0)  -> wheels built and uploaded to it
#   - "Run workflow" by hand                         -> wheels kept as a workflow artifact
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The vendored RocksDB build is the slow part (~20 min); keep it between
      # runs, keyed by the dependency versions and build settings.
      - uses: actions/cache@v4
        with:
          path: build
          key: vendored-${{ hashFiles('cmake/BuildRocksDB.cmake', 'pyproject.toml') }}

      - uses: pypa/cibuildwheel@v2.21.3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" wheelhouse/*.whl --clobber
